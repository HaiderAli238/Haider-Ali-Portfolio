{% load static %}
<section id="home" class="min-h-screen flex flex-col lg:flex-row items-center justify-between px-6 lg:px-12 py-32 bg-[#121212] overflow-hidden">
    
    <!-- LEFT CONTENT AREA -->
    <div class="flex-[1.2] space-y-6 z-10 lg:pr-10">
        <div class="inline-block px-4 py-2 bg-gradient-to-r from-[#f59e0b] to-[#b45309] rounded-lg text-black font-extrabold text-sm shadow-[0_0_15px_rgba(245,158,11,0.4)]">
            Hello, I'm
        </div>

        <h1 class="text-4xl lg:text-6xl font-black text-white leading-tight">
            <span class="text-white drop-shadow-[0_0_12px_#f59e0b]">
                HAIDER ALI HASHMI
            </span>
        </h1>

        <!-- DYNAMIC TYPE ANIMATION -->
        <div class="text-xl lg:text-3xl font-bold text-gray-300 flex items-center h-10">
            <span id="type-animation-text"></span>
            <span class="w-0.5 h-7 bg-[#f59e0b] ml-1 animate-pulse"></span>
        </div>

        <p class="text-gray-400 max-w-lg text-lg leading-relaxed">
            Software Engineer & SEO Specialist building clean server architectures, REST APIs, dynamic web apps, and high-performance search engine strategies.
        </p>

        <a href="#contact" class="inline-block">
            <button class="px-10 py-4 bg-[#f59e0b] hover:bg-[#d97706] text-black font-black rounded-full shadow-[0_0_20px_rgba(245,158,11,0.5)] transform transition-transform duration-200 hover:scale-105 active:scale-95 cursor-pointer">
                Let's Talk
            </button>
        </a>
    </div>

    <!-- RIGHT FLOATING IMAGE AREA -->
    <div class="flex-1 relative flex justify-center lg:justify-end mt-20 lg:mt-0 w-full">
        <div class="animate-hero-float relative w-64 h-80 md:w-80 md:h-[350px] p-1 rounded-3xl">
            <!-- Rotating Amber Glow -->
            <div class="absolute inset-0 bg-gradient-to-r from-[#f59e0b] via-[#d97706] to-[#f59e0b] rounded-3xl blur-md animate-pulse opacity-80"></div>

            <div class="relative w-full h-full bg-[#121212] rounded-[22px] overflow-hidden border-2 border-[#f59e0b]/40">
                <img src="{% static 'images/haider.jpeg' %}" alt="Haider Ali" class="w-full h-full object-cover" />
            </div>
        </div>
    </div>
</section>

<style>
    @keyframes heroFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
    }
    .animate-hero-float {
        animation: heroFloat 4s ease-in-out infinite;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sequence = [
            "Software Engineer",
            "SEO Specialist",
        ];
        
        let seqIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const targetElement = document.getElementById('type-animation-text');

        function playTypeAnimation() {
            const currentText = sequence[seqIndex];

            if (isDeleting) {
                targetElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                targetElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let speed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentText.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                seqIndex = (seqIndex + 1) % sequence.length;
                speed = 500;
            }

            setTimeout(playTypeAnimation, speed);
        }

        playTypeAnimation();
    });
</script>
